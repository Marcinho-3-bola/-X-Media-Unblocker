<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 240px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #15181c;
      color: #e7e9ea;
      padding: 14px;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    p {
      font-size: 12px;
      color: #71767b;
      line-height: 1.4;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #1d9bf0;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #1a8cd8;
    }
  </style>
</head>
<body>
  <h1>X Media Unblocker</h1>
  <p>Detecta midia bloqueada por verificacao de idade ou aviso de conteudo sensivel e mostra o conteudo real, usando dados publicos do fxtwitter.</p>
  <button id="rescan">Forcar nova varredura</button>
  <script src="popup.js"></script>
</body>
</html>
